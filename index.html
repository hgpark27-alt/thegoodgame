<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>어디 갈까?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="title">어디 갈까? 🎡</div>
    <div class="subtitle">장소 추가하고 돌려보세요</div>
  </header>

  <div class="wheel-wrap">
    <div class="pointer">▼</div>
    <canvas id="wheel"></canvas>
    <div id="spin-hint" class="spin-hint hidden">장소를 2개 이상 추가하세요</div>
  </div>

  <button id="spin-btn" onclick="spin()" disabled>돌려! 🎲</button>

  <!-- Result overlay -->
  <div id="result-overlay" class="hidden" onclick="closeResult()">
    <div class="result-card" onclick="event.stopPropagation()">
      <div class="result-emoji">🎉</div>
      <div class="result-label">오늘은 여기!</div>
      <div id="result-place"></div>
      <button onclick="closeResult()">다시 돌리기</button>
    </div>
  </div>

  <!-- Add place -->
  <div class="add-row">
    <input id="place-input" type="text" placeholder="가고 싶은 곳 입력..." maxlength="15" autocomplete="off">
    <button id="add-btn" onclick="addPlace()">추가</button>
  </div>

  <div id="place-list"></div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
