<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Credit Generator Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>CREDIT GENERATOR BATTLE</h1>
    </header>
    <main id="battle-field">
      <div class="player-panel" id="panel-0"></div>
      <div class="vs-divider">VS</div>
      <div class="player-panel" id="panel-1"></div>
    </main>
  </div>

  <!-- 참여하기 모달 -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <h2>JOIN SLOT <span id="modal-slot-num"></span></h2>
      <input type="text" id="nickname-input" placeholder="Nickname (max 12)" maxlength="12" autocomplete="off" spellcheck="false">
      <div id="modal-actions">
        <button id="btn-modal-confirm">JOIN</button>
        <button id="btn-modal-cancel">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- 불러오기 모달 -->
  <div id="load-modal" class="hidden">
    <div class="modal-box">
      <h2>불러오기 — SLOT <span id="load-slot-num"></span></h2>
      <input type="text" id="load-nickname" placeholder="닉네임 (최대 12자)" maxlength="12" autocomplete="off" spellcheck="false">
      <input type="text" id="load-code-input" placeholder="저장 코드 입력" autocomplete="off" spellcheck="false">
      <div id="load-error" class="load-err hidden">⚠ 잘못된 코드입니다. 다시 확인해주세요.</div>
      <div class="modal-actions-row">
        <button id="btn-confirm-load">불러오기</button>
        <button id="btn-cancel-load" class="btn-secondary">취소</button>
      </div>
    </div>
  </div>

  <!-- 저장 모달 -->
  <div id="save-modal" class="hidden">
    <div class="modal-box">
      <h2>게임 저장</h2>
      <div class="save-warn-box">
        <div class="save-warn-title">⚠️ 반드시 이 코드를 복사하세요!</div>
        <div class="save-warn-sub">창을 닫으면 코드를 다시 볼 수 없습니다</div>
      </div>
      <div class="code-display" id="save-code-text"></div>
      <div class="modal-actions-row">
        <button id="btn-copy-code">복사하기</button>
        <button id="btn-close-save" class="btn-secondary">닫기</button>
      </div>
      <div id="copy-confirm" class="copy-confirm hidden">✓ 복사됐습니다</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
