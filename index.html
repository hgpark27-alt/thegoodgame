<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Credit Generator Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>CREDIT GENERATOR BATTLE</h1>
    </header>
    <main id="battle-field">
      <div class="player-panel" id="panel-0"></div>
      <div class="vs-divider">VS</div>
      <div class="player-panel" id="panel-1"></div>
    </main>
  </div>

  <!-- 참여하기 모달 -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <h2>JOIN SLOT <span id="modal-slot-num"></span></h2>
      <input type="text" id="nickname-input" placeholder="Nickname (max 12)" maxlength="12" autocomplete="off" spellcheck="false">
      <div id="modal-actions">
        <button id="btn-modal-confirm">JOIN</button>
        <button id="btn-modal-cancel">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- 불러오기 모달 -->
  <div id="load-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-title">LOAD — SLOT <span id="load-slot-num"></span></div>
      <input type="text" id="load-code-input" placeholder="저장 코드 붙여넣기" autocomplete="off" spellcheck="false">
      <div id="load-error" class="load-err hidden">코드가 올바르지 않습니다</div>
      <div class="modal-btns">
        <button id="btn-confirm-load" class="btn-primary">불러오기</button>
        <button id="btn-cancel-load" class="btn-ghost">취소</button>
      </div>
    </div>
  </div>

  <!-- 저장 모달 -->
  <div id="save-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-title">SAVE CODE</div>
      <div class="save-hint">이 코드로 나중에 이어할 수 있습니다. 복사해 두세요.</div>
      <div class="code-display" id="save-code-text"></div>
      <div id="copy-confirm" class="copy-confirm hidden">복사됐습니다</div>
      <div class="modal-btns">
        <button id="btn-copy-code" class="btn-primary">복사</button>
        <button id="btn-close-save" class="btn-ghost">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
